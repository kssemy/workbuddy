*{box-sizing:border-box}
:root{--bg:#f6f6f6;--card:#fff;--text:#222;--muted:#777;--border:#e8e8e8;--soft:#f4f4f4;--input:#fff;--button:#222;--buttonText:#fff;--offline:#c9c9c9;--online:#59c96d;--danger:#d94949;--board:#fff}

body{font-family:Arial,"Noto Sans KR",sans-serif;font-size:8px}
button,input,select{font:inherit;color:inherit}
.app{width:100%;max-width:520px;margin:0 auto;padding:12px}
.card{background:var(--card);border:1px solid var(--border);border-radius:11px;padding:7px;margin-bottom:6px}
.top{display:flex;align-items:center;justify-content:space-between;gap:6px}.title{font-size:9px;font-weight:700}.muted{color:var(--muted);font-size:7px}
.btn{border:0;border-radius:7px;padding:6px 8px;background:var(--button);color:var(--buttonText);cursor:pointer}.btn.secondary{background:var(--soft);color:var(--text)}.btn.danger{background:transparent;color:var(--danger);border:1px solid color-mix(in srgb,var(--danger) 35%,transparent)}
.header-meta{display:flex;align-items:center;gap:5px;margin-top:2px}.online-count{color:var(--muted);font-size:7px}.status-dot{width:5px;height:5px;border-radius:50%;background:var(--offline);display:inline-block;flex:0 0 auto}.status-dot.online{background:var(--online)}
.member{min-height:28px;border-bottom:1px solid var(--border);display:grid;grid-template-columns:minmax(90px,auto) minmax(0,1fr) auto;align-items:center;gap:5px;transition:opacity .2s}.member:last-child{border-bottom:0}.member.done{opacity:.38}.member-left{display:flex;align-items:center;gap:4px;white-space:nowrap;min-width:0}.name,.state{font-size:8px;font-weight:400;color:var(--text)}
.joined{font-size:6px;color:var(--online);white-space:nowrap}.bubble-slot{min-width:0;display:flex;justify-content:center;align-items:center;gap:3px}.bubble{max-width:100%;height:16px;line-height:16px;padding:0 6px;border-radius:8px;background:var(--soft);color:var(--muted);font-size:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}.heart{font-size:7px;white-space:nowrap;color:#d86174;cursor:pointer;user-select:none}.time-left{font-size:8px;color:var(--muted);white-space:nowrap;text-align:right}.overtime-live{color:#a76bd4}
.survival-row{display:flex;gap:4px}.survival-row input{flex:1;min-width:0;border:1px solid var(--border);background:var(--input);border-radius:7px;padding:5px 6px}.counter{font-size:6px;color:var(--muted);margin-top:3px;text-align:right}
.board{height:110px;border:1px solid var(--border);border-radius:8px;background:var(--board);touch-action:none;display:block;width:100%}.tools{display:flex;justify-content:space-between;align-items:center;margin-top:5px}.color-tools,.erase-tools{display:flex;align-items:center;gap:5px}.color{width:10px;height:10px;border-radius:50%;border:1px solid transparent;padding:0;cursor:pointer}.color.active{outline:1px solid var(--muted);outline-offset:1px}.icon-btn{width:20px;height:20px;border:0;border-radius:6px;background:var(--soft);padding:0;display:grid;place-items:center;cursor:pointer;font-size:10px}
.accordion-title{display:flex;justify-content:space-between;cursor:pointer;align-items:center}.accordion-body{display:none;margin-top:7px}.accordion-body.open{display:block}.grid{display:grid;grid-template-columns:1fr 1fr;gap:5px}label{font-size:7px;color:var(--muted);display:block;margin-bottom:3px}input[type=time],select,input[type=text]{width:100%;border:1px solid var(--border);background:var(--input);border-radius:6px;padding:5px}.save-row{display:flex;gap:4px;margin-top:7px;flex-wrap:wrap}.tiny-row{display:flex;justify-content:space-between;gap:6px;align-items:center;margin-top:5px}.weekly-value{font-size:8px}.legal-warning{color:var(--danger);font-size:7px;font-weight:700}.overtime-box{margin-top:7px;padding-top:7px;border-top:1px solid var(--border)}.overtime-live-big{font-size:9px;color:#a76bd4;margin-bottom:5px}.manual-row{display:grid;grid-template-columns:1fr 1fr auto;gap:4px;align-items:end}
.who-overlay{position:fixed;inset:0;background:rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;padding:10px;z-index:99}.who-box{background:var(--card);border-radius:11px;padding:12px;width:min(260px,100%);border:1px solid var(--border)}.who-form{display:grid;gap:6px;margin-top:8px}.who-form input,.who-form select{width:100%;border:1px solid var(--border);border-radius:7px;padding:7px;background:var(--input)}.who-actions{display:flex;gap:5px;justify-content:flex-end;margin-top:2px}
#members{max-height:196px;overflow:auto}.error{font-size:6px;color:var(--danger);margin-top:4px}.success{font-size:6px;color:#4a9a5d;margin-top:4px}.pip-btn{white-space:nowrap}.section-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:5px}#boardMsg:empty,#survivalMsg:empty,#settingsMsg:empty,#weekMsg:empty{display:none}.theme-row{margin-top:8px;padding-top:7px;border-top:1px solid var(--border)}
@media(max-width:560px){.app{padding:8px}}
html.pip-mode .app{width:100%;max-width:none;margin:0;padding:6px}
html.pip-mode .pip-btn{display:none!important}
html.pip-mode .card{border-radius:11px}

html.pip-mode body{font-size:11px}

html.pip-mode .card{padding:9px;margin-bottom:7px}
html.pip-mode .btn{padding:7px 9px}

/* =========================================
   PiP MINI MODE
   - small 340x380 window
   - larger readable type
   - flat / text-first UI
========================================= */
html.pip-mode body{
  font-size:11px;
  background:var(--bg);
}

html.pip-mode .app{
  width:100%;
  max-width:none;
  margin:0;
  padding:6px 8px 10px;
}

/* mini window: remove card boxes */
html.pip-mode .card{
  background:transparent;
  border:0;
  border-radius:0;
  padding:5px 0;
  margin:0;
  box-shadow:none;
}

html.pip-mode .card + .card{
  border-top:1px solid var(--border);
}

/* top */
html.pip-mode .title{
  font-size:12px;
  line-height:1.2;
}
html.pip-mode .muted{
  font-size:9px;
  line-height:1.25;
}
html.pip-mode .btn{
  font-size:9px;
  padding:5px 7px;
  border-radius:6px;
}
html.pip-mode .pip-btn{
  display:none!important;
}

/* member rows */
html.pip-mode .member{
  height:34px;
  grid-template-columns:minmax(105px,auto) minmax(0,1fr) auto;
  gap:5px;
}
html.pip-mode .name,
html.pip-mode .state,
html.pip-mode .time-left{
  font-size:10px;
  line-height:1.2;
}
html.pip-mode .status-dot{
  width:6px;
  height:6px;
}
html.pip-mode .bubble{
  height:20px;
  line-height:20px;
  padding:0 6px;
  border-radius:10px;
  font-size:9px;
}

/* survival */
html.pip-mode .survival-row{
  gap:5px;
}
html.pip-mode .survival-row input{
  font-size:10px;
  padding:6px 7px;
  border-radius:6px;
}
html.pip-mode .counter{
  font-size:8px;
}

/* doodle */
html.pip-mode .section-head{
  margin-bottom:4px;
}
html.pip-mode .board{
  height:110px;
  border-radius:6px;
}
html.pip-mode .tools{
  margin-top:5px;
}
html.pip-mode .color{
  width:12px;
  height:12px;
}
html.pip-mode .icon-btn{
  width:22px;
  height:22px;
  font-size:11px;
}

/* hide detailed work-time areas in mini window */
html.pip-mode .pip-hide{
  display:none!important;
}

/* hide small result messages when empty */
html.pip-mode .error,
html.pip-mode .success{
  font-size:8px;
}


/* ===== FINAL MINI WINDOW: 260 x 410 ===== */
html.pip-mode .app{
  width:100%;
  max-width:none;
  margin:0;
  padding:5px 7px 8px;
}

/* Hide the entire WorkBuddy / connection / user-change header card in PiP */
html.pip-mode .app > .card:first-child{
  display:none!important;
}

/* 1.5x larger mini typography */
html.pip-mode body{font-size:16px}
html.pip-mode .title{font-size:16px}
html.pip-mode .muted{font-size:12px}
html.pip-mode .name,
html.pip-mode .state,
html.pip-mode .time-left{

}
html.pip-mode .bubble{
  font-size:13px;

}

}
html.pip-mode .btn{
  font-size:12px;
}
html.pip-mode .counter,

html.pip-mode .success{
  font-size:10px;
}

}

html.pip-mode .status-dot{
  width:6px;

}

/* Keep the flat mini UI compact */

  padding:4px 0;
}
html.pip-mode .card + .card{
  margin-top:0;
}
html.pip-mode .section-head{
  margin-bottom:3px;
}
html.pip-mode .board{
  height:105px;
}

}

}

}

}

}

/* ===== WorkBuddy final PiP refinements ===== */
html.pip-mode .app > .card:first-child{display:none!important}

/* Hide only headings/meta in PiP, not their functional content */
html.pip-mode .survival-title,
html.pip-mode .board-title,
html.pip-mode .board-meta{display:none!important}

/* Fallback for current markup: section heading wrappers */
html.pip-mode #survivalInput ~ *{} /* specificity anchor */
html.pip-mode .section-head{min-height:0;margin:0}
html.pip-mode .section-head .title,
html.pip-mode .section-head .muted{display:none!important}

/* In mini mode, section boxes are flat and close together */
html.pip-mode .card{background:transparent;border:0;border-radius:0;box-shadow:none;padding:4px 0;margin:0}
html.pip-mode .card + .card{border-top:1px solid var(--border)}
html.pip-mode .member{position:relative;overflow:visible}

/* Bubble overlays the right-side remaining-time text in PiP */
html.pip-mode .bubble-slot{
  position:absolute;
  right:0;
  top:50%;
  transform:translateY(-50%);
  z-index:4;
  justify-content:flex-end;
  pointer-events:auto;
  max-width:150px;
}
html.pip-mode .bubble{
  max-width:150px;
  font-size:15px;
  height:24px;
  line-height:24px;
  padding:0 7px;
  background:var(--card);
  border:1px solid var(--border);
  box-shadow:0 1px 3px rgba(0,0,0,.08);
}
html.pip-mode .bubble-slot:not(:empty) + .time-left{opacity:.15}

/* Full page: survival bubble/reaction same visual weight as status text */

  height:26px;
  line-height:26px;
}

html:not(.pip-mode) .reaction,

}

/* PiP survival input readable */

}

}

/* Keep ordinary muted/system labels readable too */
html:not(.pip-mode) .muted{
  font-size:12px!important;
  line-height:1.35!important;
}


/* ===== CONNECTION / ONLINE COUNT SIZE ===== */
html:not(.pip-mode) #connectionText,
html:not(.pip-mode) #connectionStatus,
html:not(.pip-mode) #onlineCount,
html:not(.pip-mode) .connection-text,
html:not(.pip-mode) .online-count,
html:not(.pip-mode) .top .muted,
html:not(.pip-mode) .topbar .muted,
html:not(.pip-mode) .header .muted{
  font-size:12px!important;
  line-height:1.35!important;
}


/* ===== REQUESTED FEATURES (safe layer) ===== */
.custom-status{
  color:var(--muted);
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  max-width:180px;
}
.member-manager-toolbar{
  display:flex;
  justify-content:flex-end;
  margin-bottom:8px;
}
.member-manager-row{
  display:flex;
  align-items:center;
  gap:8px;
  min-height:38px;
  border-bottom:1px solid var(--border);
}
.member-manager-row:last-child{border-bottom:0}
.member-manager-name{flex:1}
.member-manager-state{color:var(--muted)}
.member-manager-delete{
  border:1px solid color-mix(in srgb,var(--danger) 35%,transparent);
  background:transparent;
  color:var(--danger);
  border-radius:8px;
  padding:5px 8px;
  cursor:pointer;
}
.opacity-row label{margin:0;white-space:nowrap}
.opacity-row input[type="range"]{flex:1}
html.pip-mode .custom-status{font-size:13px!important}


/* ===== FINAL DARK + BUBBLE ===== */
html[data-theme="dark"] .board,
html[data-theme="dark"] canvas.board,
html[data-theme="dark"] #board{
  background:#1f1f1f!important;
  border-color:#3a3a3a!important;
}
.bubble{
  box-shadow:0 4px 12px rgba(0,0,0,.28)!important;
}
.day-schedule-list{display:grid;gap:5px}
.day-schedule-row{
  display:grid;
  grid-template-columns:48px 1fr 1fr;
  gap:7px;
  align-items:center;
  padding:4px 0;
  border-bottom:1px solid var(--border);
}
.day-schedule-row:last-child{border-bottom:0}
.day-schedule-day{display:flex;align-items:center;gap:4px;margin:0!important;color:var(--text)}
.day-schedule-row input[type="time"]{
  width:100%;border:1px solid var(--border);background:var(--input);border-radius:7px;padding:6px
}
.custom-mode-input{margin-top:6px}
</style>

<script>
const IS_DESKTOP = new URLSearchParams(location.search).get("desktop") === "1";
if(IS_DESKTOP) document.documentElement.classList.add("pip-mode");
const SUPABASE_URL = "https://tgyfscvjnkaiykyfyzcc.supabase.co";
const SUPABASE_KEY = "sb_publishable_4bdFjW6A7ahg9AaaV8AetQ_KEFbNYvw";
const API = SUPABASE_URL + "/rest/v1";
let sessionToken = localStorage.getItem("workbuddy_session");
let me = sessionToken ? localStorage.getItem("workbuddy_user") : null;
let pollTimer = null;
let boardDirty = false;
let boardSaveTimer = null;
let strokes = [];
let memberModes = {};
let drawing = false;
let currentStroke = null;
let currentColor = "#F3B6C6";
let eraser = false;
let presenceTimer = null;
let overtimeRows = [];
let attendanceRows = [];
let sharedMeta = {reactions:{},deletedIds:[],customStatuses:{},customModes:{},daySchedules:{}};

let previousOnline = {};
let joinedUntil = {};
let weeklyTimer = null;

const headers = {
  "apikey": SUPABASE_KEY,

};

let uiDoc = document;
const $ = s => (uiDoc || document).querySelector(s) || document.querySelector(s);
const $$ = s => Array.from((uiDoc || document).querySelectorAll(s));

function applyTheme(){
  document.documentElement.dataset.theme="dark";
  if(uiDoc && uiDoc.documentElement) uiDoc.documentElement.dataset.theme="dark";
}

function displayNameForMe(){
  return localStorage.getItem("workbuddy_name") || me || "";
}
function showWho(){
  $("#whoOverlay").style.display = "flex";
  $("#whoName").value = displayNameForMe();
  $("#whoPin").value = "";
  $("#whoMode").value = (me && memberModes[me]) || localStorage.getItem("workbuddy_mode") || "work";
  const cm=(me && sharedMeta.customModes?.[me]) || localStorage.getItem("workbuddy_custom_mode") || "";
  if($("#whoCustomMode")){
    $("#whoCustomMode").value=cm;
    $("#whoCustomMode").style.display=$("#whoMode").value==="custom"?"block":"none";
  }
  $("#whoCancelBtn").style.display = me ? "inline-block" : "none";
  setTimeout(()=>$("#whoName").focus(), 0);
}
function hideWho(){
  $("#whoOverlay").style.display = "none";
  $("#whoMsg").innerHTML = "";
  $("#whoPin").value = "";
  $("#whoInvite").value = "";
}
function clearSession(){
  window.documentPictureInPicture?.window?.close();
  me=null;
  sessionToken=null;
  lastMembers=[];
  attendanceRows=[];
  overtimeRows=[];
  strokes=[];
  delete headers["x-workbuddy-session"];
  ["workbuddy_session","workbuddy_user","workbuddy_name","workbuddy_mode","workbuddy_custom_mode"].forEach(key=>localStorage.removeItem(key));
  clearInterval(presenceTimer);
  redraw();
  $("#members").innerHTML="";
  showWho();
}
if(!me) showWho();

$("#whoCancelBtn").addEventListener("click", hideWho);
$("#whoName").addEventListener("keydown", e=>{ if(e.key==="Enter") $("#whoSaveBtn").click(); });
$("#whoPin").addEventListener("keydown", e=>{ if(e.key==="Enter") $("#whoSaveBtn").click(); });
$("#whoInvite").addEventListener("keydown", e=>{ if(e.key==="Enter") $("#whoRegisterBtn").click(); });

async function enterAccount(register){
  const name = $("#whoName").value.trim();
  const pin = $("#whoPin").value.trim();
  const invite = $("#whoInvite").value.trim();
  const mode = $("#whoMode").value;
  const customMode=($("#whoCustomMode")?.value||"").trim();
  if(!name || name.length>12 || !/^\d{6}$/.test(pin)){
    $("#whoMsg").innerHTML='<div class="error">닉네임(1~12자)과 숫자 PIN 6자리를 입력해 주세요.</div>';
    return;
  }
  if(register && !invite){
    $("#whoMsg").innerHTML='<div class="error">새 계정에는 친구 초대코드가 필요해요.</div>';
    return;
  }
  // PiP must be requested during the login click; browsers reject it after network awaits.
  const hadMini=!!window.documentPictureInPicture?.window;
  const pendingMini=requestMiniWindow();
  try{
    const result=await api(`/rpc/workbuddy_${register?"register":"login"}`,{
      method:"POST", body:JSON.stringify(register?{p_name:name,p_pin:pin,p_invite:invite}:{p_name:name,p_pin:pin})
    });
    if(result.error) throw new Error(result.error);
    sessionToken=result.session_token;
    me=result.member_id;
    headers["x-workbuddy-session"]=sessionToken;
    localStorage.setItem("workbuddy_session",sessionToken);
    const boardReady=await loadBoard().then(()=>true,()=>false);
    memberModes[me] = mode;
    sharedMeta.customModes=sharedMeta.customModes||{};
    if(mode==="custom") sharedMeta.customModes[me]=customMode||"기타중";
    else delete sharedMeta.customModes[me];
    localStorage.setItem("workbuddy_user", me);
    localStorage.setItem("workbuddy_name", result.name);
    localStorage.setItem("workbuddy_mode", mode);
    if(mode==="custom") localStorage.setItem("workbuddy_custom_mode",customMode||"기타중");
    else localStorage.removeItem("workbuddy_custom_mode");
    if(boardReady) await saveBoard().catch(()=>{});
    hideWho();
    await loadAll(true);
    startPresence();
    moveToMiniWindow(await pendingMini);
  }catch(e){
    if(!hadMini) (await pendingMini)?.close();
    $("#whoMsg").innerHTML='<div class="error">로그인 실패: '+escapeHtml(e.message)+'</div>';
  }
}
$("#whoSaveBtn").addEventListener("click",()=>enterAccount(false));
$("#whoRegisterBtn").addEventListener("click",()=>enterAccount(true));
$("#changeUserBtn").addEventListener("click", showWho);

async function api(path, options={}){
  const res = await fetch(API + path, {headers, ...options});
  if(!res.ok){
    const txt = await res.text();
    throw new Error(txt || ("HTTP " + res.status));
  }
  if(res.status===204) return null;
  const text = await res.text();
  return text ? JSON.parse(text) : null;
}

function fmtTime(t){ return (t||"").slice(0,5); }
function minutesOf(s){
  if(!s) return 0;
  const [h,m]=s.slice(0,5).split(":").map(Number);
  return h*60+m;
}
function nowMinutes(){ const d=new Date(); return d.getHours()*60+d.getMinutes(); }


function getDaySchedule(m,day){
  const saved=m.day_schedules?.[day];
  const activeDefault=(m.work_days||[1,2,3,4,5]).includes(day);
  return {
    active:saved ? saved.active!==false : activeDefault,
    start:(saved?.start || fmtTime(m.work_start) || "09:00"),
    end:(saved?.end || fmtTime(m.work_end) || "18:00")
  };
}
function fillDaySchedules(m){
  $$("#daySchedules .day-schedule-row").forEach(row=>{
    const d=Number(row.dataset.day),sc=getDaySchedule(m,d);
    const active=row.querySelector(".day-active"),start=row.querySelector(".day-start"),end=row.querySelector(".day-end");
    if(active) active.checked=sc.active;
    if(start) start.value=sc.start||"09:00";
    if(end) end.value=sc.end||"18:00";
  });
}
function readDaySchedules(){
  const out={};
  $$("#daySchedules .day-schedule-row").forEach(row=>{
    const d=Number(row.dataset.day);
    out[d]={
      active:!!row.querySelector(".day-active")?.checked,
      start:row.querySelector(".day-start")?.value||"09:00",
      end:row.querySelector(".day-end")?.value||"18:00"
    };
  });
  return out;
}

function memberState(m){
  const d=new Date(),day=d.getDay(),sc=getDaySchedule(m,day);
  const mode=memberModes[m.id]||"work";
  const isStudy=mode==="study",isGame=mode==="game",isCustom=mode==="custom";
  const customLabel=(sharedMeta.customModes?.[m.id]||"기타중").trim()||"기타중";
  const activeLabel=isCustom?customLabel:(isGame?"게임중":(isStudy?"공부중":"업무중"));
  const beforeLabel=isCustom?`${customLabel} 전`:(isGame?"게임 전":(isStudy?"공부 전":"출근 전"));
  const endLabel=isCustom?`${customLabel} 끝`:(isGame?"게임 끝":(isStudy?"공부 끝":"퇴근함"));
  const leftWord=(isStudy||isGame||isCustom)?"종료까지":"퇴근까지";
  if(!sc.active) return {label:endLabel,sub:"",done:true};
  const n=nowMinutes(),ws=minutesOf(sc.start),we=minutesOf(sc.end),ls=minutesOf(m.lunch_start),le=minutesOf(m.lunch_end);
  if(n<ws) return {label:beforeLabel,sub:`${sc.start} 시작`,done:false};
  if(n>=we) return activeOvertimeFor(m.id)
    ? {label:"야근중",sub:"",done:false} : {label:endLabel,sub:"",done:true};
  if(mode==="work"&&n>=ls&&n<le) return {label:"점심먹는중",sub:`${le-n}분 남음`,done:false};
  const left=we-n;
  return {label:activeLabel,sub:`${leftWord} ${Math.floor(left/60)}시간 ${left%60}분`,done:false};
}
function activeOvertimeFor(memberId){
  const shift=activeAttendanceFor(memberId);
  const member=lastMembers.find(m=>m.id===memberId);
  if(!shift || !member) return null;
  const end=scheduleDate(member,new Date(shift.work_date+"T00:00:00"),"end");
  return Date.now()>=end ? {member_id:memberId,started_at:new Date(Math.max(end,new Date(shift.started_at).getTime())).toISOString()} : null;
}
function activeAttendanceFor(memberId){
  return attendanceRows.find(r=>r.member_id===memberId && !r.ended_at && Date.now()-new Date(r.last_seen_at).getTime()<35000) || null;
}
function formatDurationMs(ms){ const total=Math.max(0,Math.floor(ms/1000)); const h=Math.floor(total/3600); const m=Math.floor((total%3600)/60); const sec=total%60; return `${String(h).padStart(2,"0")}:${String(m).padStart(2,"0")}:${String(sec).padStart(2,"0")}`; }

function isLunchNow(member){
  if(!member) return false;
  const mode=memberModes[member.id]||"work";
  if(mode!=="work") return false;
  const sc=getDaySchedule(member,new Date().getDay());
  if(!sc.active) return false;
  const n=nowMinutes(),ls=minutesOf(member.lunch_start),le=minutesOf(member.lunch_end);
  return n>=ls&&n<le;
}
function renderMembers(members){
  const now=Date.now();
  const visible=members.filter(m=>{
    const isOnline=!!(m.updated_at&&(now-new Date(m.updated_at).getTime()<35000));
    return !sharedMeta.deletedIds.includes(m.id) && isOnline;
  }).sort((a,b)=>{
    const aOnline=!!(a.updated_at&&(now-new Date(a.updated_at).getTime()<35000));
    const bOnline=!!(b.updated_at&&(now-new Date(b.updated_at).getTime()<35000));
    if(aOnline!==bOnline) return aOnline?-1:1;
    if(a.id===me&&b.id!==me) return -1;
    if(b.id===me&&a.id!==me) return 1;
    return String(a.name||"").localeCompare(String(b.name||""),"ko");
  });
  let onlineCount=0;
  $("#members").innerHTML=visible.map(m=>{
    const st=memberState(m); const isOnline=!!(m.updated_at&&(now-new Date(m.updated_at).getTime()<35000));
    if(isOnline) onlineCount++;

    previousOnline[m.id]=isOnline;
    const justJoined=isOnline&&joinedUntil[m.id]&&joinedUntil[m.id]>now;

    let right=escapeHtml(st.sub);

    }

function pastelForMessage(memberId,key){
  const colors=["#FFDDE7","#FFF0C9","#DDF3E4","#DCEEFF","#E9DDF7","#FFE4D6","#E1F2F2","#F4E3EE"];
  const seed=String(memberId||"")+"|"+String(key||"");
  let h=0;
  for(const ch of seed) h=((h<<5)-h)+ch.charCodeAt(0);
  return colors[Math.abs(h)%colors.length];
}

const canvas=$("#board"), ctx=canvas.getContext("2d");
function fitCanvas(){
  const r=canvas.getBoundingClientRect();
  const canvasDoc=canvas.ownerDocument;
  const canvasWin=canvasDoc.defaultView || window;
  const dpr=Math.max(1,canvasWin.devicePixelRatio||1);
  canvas.width=Math.round(r.width*dpr);
  canvas.height=Math.round(r.height*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
  redraw();
}
function redraw(){
  const r=canvas.getBoundingClientRect();
  const canvasDoc=canvas.ownerDocument;
  const canvasWin=canvasDoc.defaultView || window;
  ctx.clearRect(0,0,r.width,r.height);
  ctx.lineCap="round";ctx.lineJoin="round";
  strokes.forEach(s=>{
    if(!s.points || s.points.length<1) return;
    ctx.beginPath();
    ctx.globalCompositeOperation=s.erase ? "destination-out" : "source-over";
    ctx.strokeStyle=s.color;
    ctx.lineWidth=s.erase ? 16 : 4;
    ctx.moveTo(s.points[0].x*r.width,s.points[0].y*r.height);
    s.points.slice(1).forEach(p=>ctx.lineTo(p.x*r.width,p.y*r.height));
    ctx.stroke();
  });
  ctx.globalCompositeOperation="source-over";
}
function pos(e){ const r=canvas.getBoundingClientRect();
  const canvasDoc=canvas.ownerDocument;
  const canvasWin=canvasDoc.defaultView || window;
  return {x:(e.clientX-r.left)/Math.max(1,r.width),y:(e.clientY-r.top)/Math.max(1,r.height)};
}
canvas.addEventListener("pointerdown",e=>{
  drawing=true; canvas.setPointerCapture(e.pointerId);
  currentStroke={color:currentColor,erase:eraser,points:[pos(e)]};
  strokes.push(currentStroke); redraw();
});
canvas.addEventListener("pointermove",e=>{
  if(!drawing||!currentStroke) return;
  currentStroke.points.push(pos(e)); redraw();
});
canvas.addEventListener("pointerup",()=>{drawing=false;currentStroke=null;scheduleBoardSave();});
canvas.addEventListener("pointercancel",()=>{drawing=false;currentStroke=null;});

function weekStart(d=new Date()){ const x=new Date(d); const day=(x.getDay()+6)%7; x.setHours(0,0,0,0); x.setDate(x.getDate()-day); return x; }
function scheduleDate(m,date,part){
  const sc=getDaySchedule(m,date.getDay());
  const time=part==="lunch_start"?m.lunch_start:part==="lunch_end"?m.lunch_end:sc[part];
  const minutes=minutesOf(time);
  return new Date(date.getFullYear(),date.getMonth(),date.getDate(),Math.floor(minutes/60),minutes%60).getTime();
}
function effectiveAttendanceEnd(row,now=new Date()){
  return row.ended_at ? new Date(row.ended_at).getTime()
    : Math.min(now.getTime(),new Date(row.last_seen_at).getTime()+30000);
}
function attendanceMsFor(m,from,now,afterEnd=false){
  if(!m) return 0;
  return attendanceRows.filter(r=>r.member_id===m.id).reduce((total,r)=>{
    const date=new Date(r.work_date+"T00:00:00");
    const start=scheduleDate(m,date,"start"),end=scheduleDate(m,date,"end");
    const a=Math.max(new Date(r.started_at).getTime(),from.getTime(),afterEnd?end:start);
    const b=Math.min(effectiveAttendanceEnd(r,now),now.getTime(),afterEnd?Infinity:end);
    let ms=Math.max(0,b-a);
    if(!afterEnd && ms){
      const ls=scheduleDate(m,date,"lunch_start"),le=scheduleDate(m,date,"lunch_end");
      ms-=Math.max(0,Math.min(b,le)-Math.max(a,ls));
    }
    return total+Math.max(0,ms);
  },0);
}
function scheduledWorkedMs(m,now=new Date()){ return attendanceMsFor(m,weekStart(now),now); }
function overtimeMsFor(memberId,now=new Date(),from=weekStart(now)){
  const m=lastMembers.find(x=>x.id===memberId);
  const intervals=attendanceRows.filter(r=>r.member_id===memberId && m).map(r=>{
    const date=new Date(r.work_date+"T00:00:00");
    return [Math.max(new Date(r.started_at).getTime(),scheduleDate(m,date,"end"),from.getTime()),
      Math.min(effectiveAttendanceEnd(r,now),now.getTime())];
  });
  overtimeRows.filter(r=>r.member_id===memberId).forEach(r=>intervals.push([
    Math.max(new Date(r.started_at).getTime(),from.getTime()),
    Math.min(r.ended_at?new Date(r.ended_at).getTime():now.getTime(),now.getTime())
  ]));
  intervals.sort((a,b)=>a[0]-b[0]);
  let total=0,end=0;
  for(const [a,b] of intervals){
    if(b<=a) continue;
    total+=Math.max(0,b-Math.max(a,end));
    end=Math.max(end,b);
  }
  return total;
}

function moveToMiniWindow(pipWindow){
    if(!pipWindow || uiDoc===pipWindow.document) return;
    const app = document.querySelector(".app");
    const homeMarker = document.createComment("workbuddy-app-home");
    app.parentNode.insertBefore(homeMarker, app);

    // 현재 페이지의 CSS만 복사하고, Netlify 페이지/툴바 자체를 다시 불러오지 않습니다.
    [...document.styleSheets].forEach(sheet=>{
      try{
        const style = pipWindow.document.createElement("style");
        style.textContent = [...sheet.cssRules].map(rule=>rule.cssText).join("\n");
        pipWindow.document.head.appendChild(style);
      }catch(e){
        if(sheet.href){
          const link = pipWindow.document.createElement("link");
          link.rel = "stylesheet";
          link.href = sheet.href;
          pipWindow.document.head.appendChild(link);
        }
      }
    });

    pipWindow.document.documentElement.classList.add("pip-mode");
    pipWindow.document.documentElement.dataset.theme = "dark";
    pipWindow.document.body.style.margin = "0";
    pipWindow.document.body.style.background = "var(--bg)";
    pipWindow.document.body.style.overflowY = "auto";
    pipWindow.document.body.appendChild(app);
    const pipMsg = app.querySelector("#survivalMsg");

    // 미니창 안에서는 '미니창으로 띄우기' 버튼이 필요 없습니다.

    setTimeout(()=>{ fitCanvas(); redraw(); }, 80);
    setTimeout(fitCanvas, 180);

    pipWindow.addEventListener("pagehide", ()=>{
      if(homeMarker.parentNode){
        homeMarker.parentNode.insertBefore(app, homeMarker.nextSibling);
        homeMarker.remove();
      }
      uiDoc = document;

      if(pipButton) pipButton.style.display = "";

    el.style.lineHeight="1.4";
  });
  document.querySelectorAll(".overtime-summary,.overtime-empty,.week-total-time").forEach(el=>{
    el.style.fontSize="12px";
    el.style.lineHeight="1.4";
  });
}
setTimeout(enlargeWeeklyTexts,0);



function matchWeeklyTextToStatus(){
  const stateEl = document.querySelector(".state");
  if(!stateEl) return;
  const size = getComputedStyle(stateEl).fontSize;
  const selectors = [
    "#weekTotal","#weekTotalTime","#weekOvertimeText","#overtimeSummary",
    ".week-total-time",".overtime-summary",".overtime-empty",
    "#weekCard .muted","#weekBody .muted"
  ];
  document.querySelectorAll(selectors.join(",")).forEach(el=>{
    el.style.setProperty("font-size",size,"important");
    el.style.setProperty("line-height","1.2","important");
  });
}
setTimeout(matchWeeklyTextToStatus,100);
setInterval(matchWeeklyTextToStatus,2000);



function forceExactWeeklyFont(){
  const stateEl = document.querySelector(".state");
  if(!stateEl) return;
  const size = getComputedStyle(stateEl).fontSize;
  const weekTotal = document.querySelector("#weekTotal");
  if(weekTotal) weekTotal.style.setProperty("font-size", size, "important");
  document.querySelectorAll("#weekList, #weekList .muted, #weekList > div").forEach(el=>{
    el.style.setProperty("font-size", size, "important");
    el.style.setProperty("line-height", "1.2", "important");
  });
}
setInterval(forceExactWeeklyFont,500);
setTimeout(forceExactWeeklyFont,50);


function forceActualWeeklyFont(){
  const stateEl=document.querySelector('.state');
  if(!stateEl) return;
  const size=getComputedStyle(stateEl).fontSize;
  ['#weeklyHours','#overtimeLive'].forEach(sel=>{
    const el=document.querySelector(sel);
    if(el){
      el.style.setProperty('font-size',size,'important');
      el.style.setProperty('line-height','1.2','important');
    }
  });
}
setTimeout(forceActualWeeklyFont,50);
setInterval(forceActualWeeklyFont,1000);



function syncMiniWeeklyFromFull(){
  const mini=$("#miniWeekTotal");
  const full=$("#weeklyHours");
  if(!mini || !full) return;
  const txt=(full.textContent||"").trim();
  if(txt) mini.textContent=txt;
}
setInterval(syncMiniWeeklyFromFull,500);
setTimeout(syncMiniWeeklyFromFull,100);








</script>
</body>
